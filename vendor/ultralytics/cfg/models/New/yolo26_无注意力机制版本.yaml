# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: False # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 512] # summary: 260 layers, 2,572,280 parameters, 2,572,280 gradients, 6.1 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 260 layers, 10,009,784 parameters, 10,009,784 gradients, 22.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 280 layers, 21,896,248 parameters, 21,896,248 gradients, 75.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 392 layers, 26,299,704 parameters, 26,299,704 gradients, 93.8 GFLOPs
  x: [1.00, 1.50, 512] # summary: 392 layers, 58,993,368 parameters, 58,993,368 gradients, 209.5 GFLOPs

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  # [from, repeats, module, args]
  - [ -1, 1, shufflenetv2_05, [ ] ] # 0-4 P1/2
  - [ -1, 1, SPPF, [512, 5, 3, True] ] # 5
#  - [ -1, 2, C2PSA, [ 512 ] ] # 6
#  - [ -1, 1, DWConv, [512, 7, 1, 3] ] # 6

# 魔改金字塔聚焦注意力机制

# YOLO26n head
head:
  - [-1, 1, DWConv, [256, 1, 1]]  # 7, Y5, lateral_convs.0
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]

  - [3, 1, DWConv, [256, 1, 1, 1, False]]  # 9 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 11, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]  # 12, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [2, 1, DWConv, [256, 1, 1, 1, False]]  # 14 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # cat backbone P4
  - [ -1, 2, ESPBlock, [ 256 ] ]

  - [-1, 1, DWConv, [256, 3, 2]]  # 17, downsample_convs.0
  - [[-1, 11], 1, Concat, [1]]  # cat Y4
  - [ -1, 2, ESPBlock, [ 256 ] ]

  - [-1, 1, DWConv, [256, 3, 2]]  # 20, downsample_convs.1
  - [[-1, 6], 1, Concat, [1]]  # cat Y5
  - [-1, 2, ESPBlock, [256]]

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)
